[project]
name = "csp-bench"
version = "0.1.0"
description = "Diagnostic metrics for generative crystal structure prediction — symmetry, lattice, bonding/topology, energy/phonon axes, F0-F9 failure taxonomy, top-1/top-K aggregation."
readme = "csp_bench/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pymatgen",
    "spglib",
    "ase",
    "numpy",
    "scipy",
    "networkx",
    "phonopy",
]

[project.optional-dependencies]
mattersim = ["mattersim"]
chgnet = ["chgnet"]
mace = ["mace-torch"]
uma = ["fairchem-core"]
dev = ["pytest"]

[tool.setuptools]
packages = ["csp_bench"]

[tool.pytest.ini_options]
markers = ["slow: exercises a real MLIP backend (relaxation, phonons) — excluded by default"]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
